def isWinOs = System.properties['os.name'].toLowerCase().contains('windows')
def runOnDevice = project.hasProperty("runOnDevice")
def runOnDeviceOrEmulator = runOnDevice ? "-d" : "-e"

// One device for the whole run. Without ANDROID_SERIAL, :app:installDebug installs on every
// connected device, overwriting whatever build of the test app the others are running.
def targetSerial = null
def resolveTargetSerial = { ->
    if (targetSerial != null) {
        return targetSerial
    }
    def fromEnv = System.getenv("ANDROID_SERIAL")
    if (fromEnv) {
        targetSerial = fromEnv
        return targetSerial
    }
    def proc = ["adb", runOnDeviceOrEmulator, "get-serialno"].execute()
    def stdout = new StringBuilder()
    def stderr = new StringBuilder()
    proc.waitForProcessOutput(stdout, stderr)
    def serial = stdout.toString().trim()
    if (proc.exitValue() != 0 || !serial) {
        throw new GradleException("Could not pick a single ${runOnDevice ? 'device' : 'emulator'} " +
                "(adb ${runOnDeviceOrEmulator}: ${stderr.toString().trim()}). Set ANDROID_SERIAL to choose one.")
    }
    targetSerial = serial
    return targetSerial
}
def adbTarget = { -> ["-s", resolveTargetSerial()] }

def onlyX86 = project.hasProperty("onlyX86")
def useCCache = project.hasProperty("useCCache")
def selectedAbis = project.hasProperty("abis") ? project.property("abis") : null

