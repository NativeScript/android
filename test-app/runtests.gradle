task waitForEmulatorToStart(type: Exec) {
    doFirst {
        println "Waiting for emulator to start..."

        def envSerial = System.getenv("ANDROID_SERIAL")
        def selector = envSerial ? ["-s", envSerial] : [runOnDeviceOrEmulator]
        if (isWinOs) {
            commandLine(["cmd", "/c", "node", "$rootDir\\tools\\make_sure_emulator_is_ready.js"] + selector)
        } else {
            commandLine(["node", "$rootDir/tools/make_sure_emulator_is_ready.js"] + selector)
        }
    }
}

def getBuildArguments = { ->
    def arguments = []
    if (isWinOs) {
        arguments += ["cmd", "/c", "gradlew"]
    } else {
        arguments.add("./gradlew")
    }
    arguments.add(":app:installDebug")
    if (onlyX86) {
        arguments.add("-PonlyX86")
    }
    if (project.hasProperty("abis")) {
        arguments.add("-Pabis=${project.property('abis')}")
    }
    if (useCCache) {
        arguments.add("-PuseCCache")
    }
    if (selectedAbis != null) {
        arguments.add("-Pabis=${selectedAbis}")
    }

    arguments.add("-PuseKotlin=true")

    return arguments
}

task installApk(type: Exec) {
    doFirst {
        println "Attempting to install buit apk"
        environment "ANDROID_SERIAL", resolveTargetSerial()
        commandLine getBuildArguments()
    }
}

task deletePreviousResultXml(type: Exec) {
    ignoreExitValue = true
    doFirst {
        println "Removing previous android_unit_test_results.xml"

        if (isWinOs) {
            commandLine(["cmd", "/c", "adb"] + adbTarget() + ["shell", "run-as", "com.tns.testapplication", "rm", "-f", "android_unit_test_results.xml"])
        } else {
            commandLine(["adb"] + adbTarget() + ["shell", "run-as", "com.tns.testapplication", "rm", "-f", "android_unit_test_results.xml"])
        }
    }
}

task startInstalledApk(type: Exec) {
    doFirst {
        println "Starting test application"

        if (isWinOs) {
            commandLine(["cmd", "/c", "adb"] + adbTarget() + ["shell", "am", "start", "-n", "com.tns.testapplication/com.tns.NativeScriptActivity", "-a", "android.intent.action.MAIN", "-c", "android.intent.category.LAUNCHER"])
        } else {
            commandLine(["adb"] + adbTarget() + ["shell", "am", "start", "-n", "com.tns.testapplication/com.tns.NativeScriptActivity", "-a", "android.intent.action.MAIN", "-c", "android.intent.category.LAUNCHER"])
        }
    }
}

task createDistFolder {
    doLast {
        def distDir = file("$rootDir/dist")
        distDir.mkdirs()
    }
}

task waitForUnitTestResultFile(type: Exec) {
    doFirst {
        println "Waiting for tests to finish..."

        if (isWinOs) {
            commandLine(["cmd", "/c", "node", "$rootDir\\tools\\try_to_find_test_result_file.js"] + adbTarget())
        } else {
            commandLine(["node", "$rootDir/tools/try_to_find_test_result_file.js"] + adbTarget())
        }
    }
}

task copyResultToDist(type: Copy) {
    from "$rootDir/android_unit_test_results.xml"
    into "$rootDir/dist"
}

task deleteRootLevelResult(type: Delete) {
    delete "$rootDir/android_unit_test_results.xml"
}

task verifyResults(type: Exec) {
    doFirst {
        if (isWinOs) {
            commandLine "cmd", "/c", "node", "$rootDir\\tools\\check_if_tests_passed.js", "$rootDir\\dist\\android_unit_test_results.xml"
        } else {
            commandLine "node", "$rootDir/tools/check_if_tests_passed.js", "$rootDir/dist/android_unit_test_results.xml"
        }
    }
}

task runtests {
    dependsOn deleteRootLevelResult
}

// waitForEmulatorToStart.dependsOn(deleteDist)
installApk.dependsOn(waitForEmulatorToStart)
// Runs after the install: run-as only works once the debuggable build is on the device.
deletePreviousResultXml.dependsOn(installApk)
startInstalledApk.dependsOn(deletePreviousResultXml)
createDistFolder.dependsOn(startInstalledApk)
waitForUnitTestResultFile.dependsOn(createDistFolder)
copyResultToDist.dependsOn(waitForUnitTestResultFile)
deleteRootLevelResult.dependsOn(copyResultToDist)
verifyResults.dependsOn(runtests)

task runtestsAndVerifyResults {
    dependsOn verifyResults
}