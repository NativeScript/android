// Standalone build (see settings.gradle next to it) that installs the test app on a
// device and collects the results. Everything runs from the test-app directory, since
// the node tools and the nested gradlew calls resolve paths against the working directory.
def testAppDir = rootDir.parentFile

tasks.withType(Exec).configureEach {
    workingDir = testAppDir
}

def isWinOs = System.properties['os.name'].toLowerCase().contains('windows')
def runOnDevice = project.hasProperty("runOnDevice")
def runOnDeviceOrEmulator = runOnDevice ? "-d" : "-e"

def onlyX86 = project.hasProperty("onlyX86")
def useCCache = project.hasProperty("useCCache")
def selectedAbis = project.hasProperty("abis") ? project.property("abis") : null

// task deleteDist(type: Delete) {
//     doFirst {
//         delete "$testAppDir/dist"
//     }
// }

task waitForEmulatorToStart(type: Exec) {
    doFirst {
        println "Waiting for emulator to start..."

        if (isWinOs) {
            commandLine "cmd", "/c", "node", "$testAppDir\\tools\\make_sure_emulator_is_ready.js", runOnDeviceOrEmulator
        } else {
            commandLine "node", "$testAppDir/tools/make_sure_emulator_is_ready.js", runOnDeviceOrEmulator
        }
    }
}

def getBuildArguments = { ->
    def arguments = []
    if (isWinOs) {
        arguments += ["cmd", "/c", "gradlew"]
    } else {
        arguments.add("./gradlew")
    }
    arguments.add(":app:installDebug")
    if (onlyX86) {
        arguments.add("-PonlyX86")
    }
    if (project.hasProperty("abis")) {
        arguments.add("-Pabis=${project.property('abis')}")
    }
    if (useCCache) {
        arguments.add("-PuseCCache")
    }
    if (selectedAbis != null) {
        arguments.add("-Pabis=${selectedAbis}")
    }

    arguments.add("-PuseKotlin=true")

    return arguments
}

task installApk(type: Exec) {
    doFirst {
        println "Attempting to install buit apk"
        commandLine getBuildArguments()
    }
}

task runAdbAsRoot(type: Exec) {
    doFirst {
        println "Running adb as root"

        if (isWinOs) {
            commandLine "cmd", "/c", "adb", "-e", "root"
        } else {
            commandLine "adb", "-e", "root"
        }
        sleep(10 * 1000) // wait 10s to make sure adb properly restarts, otherwise error: closed might happen on next command
    }
}

task deletePreviousResultXml(type: Exec) {
    ignoreExitValue = true
    doFirst {
        println "Removing previous android_unit_test_results.xml"

        if (isWinOs) {
            commandLine "cmd", "/c", "adb", runOnDeviceOrEmulator, "-e", "shell", "run-as", "com.tns.testapplication", "rm", "-f", "android_unit_test_results.xml"
        } else {
            commandLine "adb", runOnDeviceOrEmulator, "-e", "shell", "run-as", "com.tns.testapplication", "rm", "-f", "android_unit_test_results.xml"
        }
    }
}

task startInstalledApk(type: Exec) {
    doFirst {
        println "Starting test application"

        if (isWinOs) {
            commandLine "cmd", "/c", "adb", runOnDeviceOrEmulator, "-e", "shell", "am", "start", "-n", "com.tns.testapplication/com.tns.NativeScriptActivity", "-a", "android.intent.action.MAIN", "-c", "android.intent.category.LAUNCHER"
        } else {
            commandLine "adb", runOnDeviceOrEmulator, "-e", "shell", "am", "start", "-n", "com.tns.testapplication/com.tns.NativeScriptActivity", "-a", "android.intent.action.MAIN", "-c", "android.intent.category.LAUNCHER"
        }
    }
}

task createDistFolder {
    doLast {
        def distDir = file("$testAppDir/dist")
        distDir.mkdirs()
    }
}

task waitForUnitTestResultFile(type: Exec) {
    doFirst {
        println "Waiting for tests to finish..."

        if (isWinOs) {
            commandLine "cmd", "/c", "node", "$testAppDir\\tools\\try_to_find_test_result_file.js", runOnDeviceOrEmulator
        } else {
            commandLine "node", "$testAppDir/tools/try_to_find_test_result_file.js", runOnDeviceOrEmulator
        }
    }
}

task copyResultToDist(type: Copy) {
    from "$testAppDir/android_unit_test_results.xml"
    into "$testAppDir/dist"
}

task deleteRootLevelResult(type: Delete) {
    delete "$testAppDir/android_unit_test_results.xml"
}

task verifyResults(type: Exec) {
    doFirst {
        if (isWinOs) {
            commandLine "cmd", "/c", "node", "$testAppDir\\tools\\check_if_tests_passed.js", "$testAppDir\\dist\\android_unit_test_results.xml"
        } else {
            commandLine "node", "$testAppDir/tools/check_if_tests_passed.js", "$testAppDir/dist/android_unit_test_results.xml"
        }
    }
}

task runtests {
    dependsOn deleteRootLevelResult
}

// waitForEmulatorToStart.dependsOn(deleteDist)
runAdbAsRoot.dependsOn(waitForEmulatorToStart)
deletePreviousResultXml.dependsOn(runAdbAsRoot)
installApk.dependsOn(deletePreviousResultXml)
startInstalledApk.dependsOn(installApk)
createDistFolder.dependsOn(startInstalledApk)
waitForUnitTestResultFile.dependsOn(createDistFolder)
copyResultToDist.dependsOn(waitForUnitTestResultFile)
deleteRootLevelResult.dependsOn(copyResultToDist)
verifyResults.dependsOn(runtests)

task runtestsAndVerifyResults {
    dependsOn verifyResults
}