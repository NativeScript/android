def SBG_APP_CLASSES_DIR = layout.buildDirectory.dir("nativescript/sbg-app-classes")
// An annotation processor can change the shape of the classes it processes (add or remove
// constructors and methods), which the step's compile without processors cannot see, so
// declaring any for the app's main compile turns the step off. Read only once
// configuration is over, from the declared dependencies, without resolving anything.
def appAnnotationProcessorConfigurations = null
def sbgAppClassesEnabled = { ->
    if (project.hasProperty("skipSbgAppClasses")) {
        def value = project.property("skipSbgAppClasses").toString()
        if (value.isEmpty() || value.toBoolean()) {
            return false
        }
    }
    if (appAnnotationProcessorConfigurations == null) {
        appAnnotationProcessorConfigurations = configurations.findAll { configuration ->
            def name = configuration.name
            def processors = name.toLowerCase().contains("annotationprocessor") || name.startsWith("kapt")
            def forTests = name ==~ /^(test|androidTest|kaptTest|kaptAndroidTest).*|.*(UnitTest|AndroidTest).*/
            return processors && !forTests && !configuration.dependencies.isEmpty()
        }*.name.sort()
        if (!appAnnotationProcessorConfigurations.isEmpty()) {
            logger.info("compileAppClassesForSbg: skipped, as the app declares annotation processors (${appAnnotationProcessorConfigurations.join(', ')}), which can change classes in ways it cannot see")
        }
    }
    return appAnnotationProcessorConfigurations.isEmpty()
}

// The static binding generator runs before javac and kotlinc, so on its own it cannot see
// the classes and interfaces declared in this module's sources (App_Resources) and leaves
// every JS subclass of them to be generated on the device. This compiles them for it alone.
// Best-effort: sources that only compile together with the rest of the build (annotation
// processors, generated code) are left out, and any failure leaves the generator exactly
// as it would be without this task. The generator leaves the JS subclasses of these classes
// it cannot write a binding for to the runtime, and runSbg drops the bindings javac rejects.
// -PskipSbgAppClasses turns it off, as does an annotation processor of the app.
//
// The generator fails the build on a JS subclass of a class whose supertypes it cannot
// load, so every class written here must compile against the others alone. Kotlin is
// therefore compiled against the Java classes that compiled on their own, never against
// Java sources, and the Java sources that need Kotlin are compiled after it.
tasks.register("compileAppClassesForSbg") {
    dependsOn "collectAllJars"
    onlyIf { sbgAppClassesEnabled() }

    def classesDir = SBG_APP_CLASSES_DIR
    def dependenciesFile = file("$BUILD_TOOLS_PATH/$SBG_JAVA_DEPENDENCIES")
    // The first line of the static binding generator's Generator.AUTO_GENERATED_FILE_PROLOGUE.
    // It writes named classes (`extend("a.b.C", ...)`, @JavaProxy) outside com/tns/gen too.
    def sbgSourcePrefix = "/* AUTO-GENERATED FILE. DO NOT MODIFY.".getBytes(StandardCharsets.UTF_8)
    def sources = fileTree(OUTPUT_JAVA_DIR) {
        include "**/*.java"
        exclude "com/tns/gen/**"
    }.filter { File source ->
        try {
            !source.withInputStream { Arrays.equals(it.readNBytes(sbgSourcePrefix.length), sbgSourcePrefix) }
        } catch (IOException ignored) {
            true
        }
    }
    def kotlinSources = fileTree(OUTPUT_JAVA_DIR) { include "**/*.kt" }
    def sourceLevel = provider { android.compileOptions.sourceCompatibility.toString() }
    def targetLevel = provider { android.compileOptions.targetCompatibility.toString() }
    def sourceEncoding = provider { android.compileOptions.encoding ?: "UTF-8" }

    // The bindings are compiled against compileKotlin's classes, so these must have the same
    // shape: internal members are mangled with the module name, and compiler plugins and the
    // jvm-default mode decide which methods exist and which are abstract.
    // With product flavors several variants share the build type; the one the requested tasks
    // name is preferred, as the bindings are generated once for all of them.
    def kotlinCompileTaskName = { ->
        def suffix = "${project.selectedBuildType.capitalize()}Kotlin"
        def candidates = tasks.names.findAll { it.startsWith("compile") && it.endsWith(suffix) }.sort()
        def requested = gradle.startParameter.taskNames.collect { it.toLowerCase() }
        return candidates.find { name ->
            def variant = name.substring("compile".length(), name.length() - "Kotlin".length()).toLowerCase()
            requested.any { it.contains(variant) }
        } ?: candidates[0]
    }
    def kotlinCompilation = provider {
        if (kotlinSources.isEmpty()) {
            return [:]
        }
        try {
            def compileTask = tasks.getByName(kotlinCompileTaskName())
            def options = compileTask.compilerOptions
            def arguments = ["-module-name", options.moduleName.get(), "-jvm-target", options.jvmTarget.get().target]
            if (options.languageVersion.isPresent()) {
                arguments += ["-language-version", options.languageVersion.get().version]
            }
            if (options.apiVersion.isPresent()) {
                arguments += ["-api-version", options.apiVersion.get().version]
            }
            if (options.hasProperty("jvmDefault") && options.jvmDefault.isPresent()) {
                arguments += "-jvm-default=${options.jvmDefault.get().compilerArgument}"
            }
            if (options.noJdk.getOrElse(false)) {
                arguments += "-no-jdk"
            }
            arguments += options.optIn.get().collect { "-opt-in=$it" }
            arguments += options.freeCompilerArgs.get().findAll { it != "-Werror" }
            arguments += compileTask.pluginClasspath.files.collect { "-Xplugin=${it.absolutePath}" }
            return [version: org.jetbrains.kotlin.gradle.plugin.KotlinPluginWrapperKt.getKotlinPluginVersion(project), arguments: arguments]
        } catch (Exception | LinkageError e) {
            return [unavailable: e.toString()]
        }
    }

    inputs.files(sources).skipWhenEmpty().withPathSensitivity(PathSensitivity.RELATIVE).withPropertyName("sources")
    inputs.files(kotlinSources).skipWhenEmpty().ignoreEmptyDirectories().withPathSensitivity(PathSensitivity.RELATIVE).withPropertyName("kotlinSources")
    inputs.files(provider {
        dependenciesFile.exists() ? dependenciesFile.readLines().findAll { it } : []
    }).withPropertyName("classpath")
    inputs.property("sourceLevel", sourceLevel)
    inputs.property("targetLevel", targetLevel)
    inputs.property("sourceEncoding", sourceEncoding)
    inputs.property("kotlinCompilation", kotlinCompilation)
    outputs.dir(classesDir).withPropertyName("classes")

    doLast {
        def outDir = classesDir.get().asFile
        outDir.deleteDir()
        outDir.mkdirs()

        def classpath = dependenciesFile.readLines().findAll { it }
        def javaSources = sources.files.sort()
        def kotlinFiles = kotlinSources.files.sort()

        def compileJava = { List<File> files, List<String> compileClasspath, File classOutput ->
            compileJavaLeavingOutFailures(files, compileClasspath, classOutput,
                    [source: sourceLevel.get(), target: targetLevel.get(), encoding: sourceEncoding.get()], 20)
        }

        try {
            def javaDir = new File(outDir, "java")
            def java = javaSources.isEmpty() ? [compiled: true, leftOut: [], error: null] : compileJava(javaSources, classpath, javaDir)
            if (!java.compiled) {
                javaDir.deleteDir()
            }

            def javaLeftOut = java.leftOut
            def javaError = java.error
            if (!kotlinFiles.isEmpty()) {
                def kotlinDir = new File(outDir, "kotlin")
                def kotlinClasspath = java.compiled ? classpath + javaDir.absolutePath : classpath
                def kotlinCompiled = compileKotlinForSbg(kotlinCompilation.get(), kotlinFiles, kotlinClasspath, kotlinDir, temporaryDir, logger)
                if (kotlinCompiled) {
                    leaveOutClassesBindingsCannotImplement(kotlinDir, logger)
                }
                if (kotlinCompiled && !javaLeftOut.isEmpty()) {
                    def onKotlinDir = new File(outDir, "java-on-kotlin")
                    def onKotlin = compileJava(javaLeftOut, kotlinClasspath + kotlinDir.absolutePath, onKotlinDir)
                    if (onKotlin.compiled) {
                        javaLeftOut = onKotlin.leftOut
                        javaError = onKotlin.error
                    } else {
                        onKotlinDir.deleteDir()
                    }
                }
            }

            if (!java.compiled && javaLeftOut.size() == javaSources.size()) {
                logger.warn("compileAppClassesForSbg: the app's Java sources did not compile on their own, so the app's own Java classes get no prebuilt bindings (${java.error})")
            } else if (!javaLeftOut.isEmpty()) {
                def names = javaLeftOut.collect { it.name }.sort()
                logger.info("compileAppClassesForSbg: ${javaLeftOut.size()} of ${javaSources.size()} Java sources get no prebuilt bindings because they only compile with the rest of the build: ${names.take(5).join(', ')}${names.size() > 5 ? ', ...' : ''} (${javaError})")
            }
        } catch (Exception | LinkageError e) {
            outDir.deleteDir()
            outDir.mkdirs()
            logger.warn("compileAppClassesForSbg: the app's own classes get no prebuilt bindings: ${e}")
        }
    }
}

// javac writes no class files after its first error, so each failing round leaves out the
// sources that reported errors and compiles the rest again. A round that cannot leave any
// source out (stuck) or the last of maxRounds ends the loop. errors maps each left-out
// source to its first error. With -Werror among extraOptions a warning counts as an error
// of its source.
def compileJavaLeavingOutFailures(List<File> files, List<String> classpath, File classOutput, Map levels, int maxRounds, List<String> extraOptions = []) {
    def remaining = new ArrayList<File>(files)
    def leftOut = []
    def errorsBySource = [:]
    def errorDiagnostics = []
    def firstError = null
    def compiled = false
    def stuck = false
    def compiler = ToolProvider.getSystemJavaCompiler()
    if (compiler == null) {
        return [compiled: false, stuck: true, leftOut: files, errors: [:], diagnostics: [], error: "${System.getProperty('java.home')} has no Java compiler"]
    }
    def describe = { Diagnostic d -> d.getMessage(Locale.ROOT).readLines().take(2).join(" ").replaceAll(/\s+/, " ") }
    // Only the files passed are compiled: javac would otherwise compile a source it finds
    // on the classpath, such as one a dependency jar ships, into classOutput.
    def warningsAreErrors = extraOptions.contains("-Werror")
    def options = ["-proc:none", "-Xmaxerrs", "100000", "-Xmaxwarns", "100000", "-implicit:none",
                   "-source", levels.source, "-target", levels.target,
                   "-encoding", levels.encoding,
                   "-classpath", classpath.join(File.pathSeparator),
                   "-d", classOutput.absolutePath] + (warningsAreErrors ? [] : ["-nowarn"]) + extraOptions
    classOutput.mkdirs()
    for (int round = 0; round < maxRounds && !remaining.isEmpty() && !compiled; round++) {
        def diagnostics = new DiagnosticCollector()
        def fileManager = compiler.getStandardFileManager(diagnostics, Locale.ROOT, Charset.forName(levels.encoding))
        try {
            fileManager.setLocation(StandardLocation.SOURCE_PATH, [])
            def units = fileManager.getJavaFileObjectsFromFiles(remaining).toList()
            def sourceByUri = [units, remaining].transpose().collectEntries { unit, source -> [(unit.toUri()): source] }
            compiled = compiler.getTask(new StringWriter(), fileManager, diagnostics, options, null, units).call()
            if (!compiled) {
                // javac adds an error of no source to the warnings -Werror turned into errors.
                def errors = diagnostics.diagnostics.findAll {
                    it.kind == Diagnostic.Kind.ERROR
                            ? it.code != "compiler.err.warnings.and.werror" || !warningsAreErrors
                            : warningsAreErrors && (it.kind == Diagnostic.Kind.WARNING || it.kind == Diagnostic.Kind.MANDATORY_WARNING)
                }
                errorDiagnostics.addAll(errors.collect { [code: it.code, message: it.getMessage(Locale.ROOT)] })
                if (firstError == null && !errors.isEmpty()) {
                    firstError = describe(errors[0])
                }
                def failing = errors.collect { it.source == null ? null : sourceByUri[it.source.toUri()] }.toSet()
                if (failing.isEmpty() || failing.contains(null)) {
                    stuck = true
                    break
                }
                errors.each { error ->
                    errorsBySource.putIfAbsent(sourceByUri[error.source.toUri()], describe(error))
                }
                remaining.removeAll(failing)
                leftOut.addAll(failing)
            }
        } finally {
            fileManager.close()
        }
        if (!compiled) {
            classOutput.deleteDir()
            classOutput.mkdirs()
        }
    }
    if (!compiled && !remaining.isEmpty()) {
        return [compiled: false, stuck: stuck, leftOut: files, errors: errorsBySource, diagnostics: errorDiagnostics, error: firstError]
    }
    return [compiled: true, stuck: false, leftOut: leftOut, errors: errorsBySource, diagnostics: errorDiagnostics, error: firstError]
}

// Bindings written for call sites that involve the app's own classes, which only
// compileAppClassesForSbg shows the static binding generator, are compiled on their own
// first: the class of a call site whose binding javac rejects is generated at runtime, as
// without that task. Whatever keeps this check from telling a bad binding from an
// incomplete classpath skips it, and the app's compile decides as it would without it.
// compilerArgs are those the app's compile adds that make it reject more than javac does by
// default; a binding only that compile would reject is left to the runtime too.
def leaveOutAppBindingsJavacRejects(File appBindingsList, List<String> dependencies, File appClassesDir, Map levels, List<String> compilerArgs, File temporaryDir, Logger logger) {
    if (!appBindingsList.isFile()) {
        return
    }
    def bindings = appBindingsList.readLines("UTF-8").findAll { it }.collect { new File(it) }.findAll { it.isFile() }.unique()
    if (bindings.isEmpty()) {
        return
    }
    def skip = { String reason ->
        logger.warn("runSbg: the prebuilt bindings of the app's own classes were not checked, so the app's compile checks them (${reason})")
    }
    def trialDir = new File(temporaryDir, "sbg-app-bindings-trial")
    try {
        def appClassesPath = appClassesDir.canonicalPath
        def classpath = dependencies.findAll { new File(it).canonicalPath != appClassesPath } +
                ["java", "kotlin", "java-on-kotlin"].collect { new File(appClassesDir, it) }.findAll { it.isDirectory() }*.absolutePath

        // The runtime library's classes are not app classes: without them every binding fails.
        trialDir.deleteDir()
        def probe = new File(trialDir, "probe/SbgBindingClasspathProbe.java")
        probe.parentFile.mkdirs()
        probe.setText("class SbgBindingClasspathProbe { com.tns.Runtime a; com.tns.NativeScriptHashCodeProvider b; com.tns.NativeScriptRuntimeBound c; com.tns.JavaScriptImplementation d; }", "UTF-8")
        def probed = compileJavaLeavingOutFailures([probe], classpath, new File(trialDir, "probe-classes"), levels, 1)
        if (!probed.compiled || !probed.leftOut.isEmpty()) {
            skip("the runtime's classes are missing from the classpath: ${probed.error ?: 'javac failed'}")
            return
        }

        def result = compileJavaLeavingOutFailures(bindings, classpath, new File(trialDir, "classes"), levels, 10, compilerArgs)
        if (result.stuck) {
            skip(result.error ?: "javac failed")
            return
        }
        // The runtime classes bindings use: from the runtime library, and RuntimeHelper from
        // the app's sources, which may not have compiled on their own.
        def runtimeClasses = ["Runtime", "RuntimeHelper", "NativeScriptHashCodeProvider", "NativeScriptRuntimeBound", "JavaScriptImplementation"]
        def runtimeClassMissing = result.diagnostics.find { error ->
            def unresolved = error.code.startsWith("compiler.err.cant.resolve") || error.code == "compiler.err.doesnt.exist"
            return unresolved && ((error.message =~ /(?m)location: package com\.tns\s*$|package com\.tns does not exist/).find() ||
                    runtimeClasses.any { error.message.contains("com.tns.${it}") })
        }
        if (runtimeClassMissing) {
            skip(runtimeClassMissing.message.readLines().take(3).join(" ").replaceAll(/\s+/, " "))
            return
        }
        result.errors.each { File binding, String error ->
            binding.delete()
            logger.info("runSbg: ${binding.absolutePath} is left to be generated at runtime: javac rejects it (${error})")
        }
    } catch (Exception | LinkageError e) {
        skip(e.toString())
    } finally {
        trialDir.deleteDir()
    }
}

// A generated binding is Java source that every build variant compiles, so it cannot
// implement an abstract method whose JVM name is not a Java identifier (Kotlin mangles
// functions taking or returning value classes with a '-'), nor an internal one, whose name
// carries the variant's module name. Classes with such abstract methods, and the classes
// written here that extend them, are left to be generated on the device.
def leaveOutClassesBindingsCannotImplement(File classDir, Logger logger) {
    def supertypes = [:]
    def files = [:]
    def leftOut = [] as Set
    classDir.eachFileRecurse(groovy.io.FileType.FILES) { File file ->
        if (!file.name.endsWith(".class")) {
            return
        }
        def reader = new ClassReader(file.bytes)
        def unimplementable = [false]
        reader.accept(new ClassVisitor(Opcodes.ASM9) {
            @Override
            MethodVisitor visitMethod(int access, String name, String descriptor, String signature, String[] exceptions) {
                if ((access & Opcodes.ACC_ABSTRACT) != 0 && (name.contains('$') || !SourceVersion.isName(name))) {
                    unimplementable[0] = true
                }
                return null
            }
        }, ClassReader.SKIP_CODE | ClassReader.SKIP_DEBUG | ClassReader.SKIP_FRAMES)
        def name = reader.className
        files[name] = file
        supertypes[name] = ([reader.superName] + (reader.interfaces as List)).findAll { it }
        if (unimplementable[0]) {
            leftOut << name
        }
    }
    def added = true
    while (added) {
        added = false
        supertypes.each { name, types ->
            if (!leftOut.contains(name) && types.any { leftOut.contains(it) }) {
                leftOut << name
                added = true
            }
        }
    }
    leftOut.each { files[it].delete() }
    if (!leftOut.isEmpty()) {
        def names = leftOut.collect { it.replace('/', '.') }.sort()
        logger.info("compileAppClassesForSbg: ${names.size()} Kotlin classes get no prebuilt bindings because a binding cannot implement their internal or name-mangled abstract methods: ${names.take(5).join(', ')}${names.size() > 5 ? ', ...' : ''}")
    }
}

// Compiles the app's Kotlin sources for compileAppClassesForSbg with the compiler of the
// Kotlin Gradle plugin, in a separate JVM so the compiler's classes never stay loaded in the
// Gradle daemon. Like javac, kotlinc writes nothing after an error, so each failing round
// leaves out the sources that reported errors. Each round costs a compiler start and can
// only expose the sources that used the ones just left out, so the rounds are capped.
// Returns whether classes were written.
def compileKotlinForSbg(Map compilation, List<File> kotlinFiles, List<String> dependencies, File classOutput, File temporaryDir, Logger logger) {
    def fail = { String reason ->
        classOutput.deleteDir()
        logger.warn("compileAppClassesForSbg: the app's Kotlin classes get no prebuilt bindings (${reason})")
        return false
    }
    if (!compilation.arguments) {
        return fail(compilation.unavailable ?: "no Kotlin compile task")
    }
    def compilerClasspath = configurations.findByName("kotlinCompilerClasspath")
    if (compilerClasspath == null) {
        return fail("no kotlinCompilerClasspath configuration")
    }

    try {
        return runKotlincRounds(compilerClasspath, compilation.arguments, kotlinFiles, dependencies, classOutput, temporaryDir, logger, fail)
    } catch (Exception | LinkageError e) {
        return fail(e.toString())
    }
}

def runKotlincRounds(FileCollection compilerClasspath, List<String> compilerArguments, List<File> kotlinFiles, List<String> dependencies,
                     File classOutput, File temporaryDir, Logger logger, Closure<Boolean> fail) {
    def remaining = new ArrayList<File>(kotlinFiles)
    def leftOut = []
    def firstError = null
    def sourceByPath = kotlinFiles.collectEntries { [(it.canonicalPath): it] }
    def quoteArgument = { String argument -> '"' + argument.replace('\\', '\\\\').replace('"', '\\"') + '"' }
    def argumentFile = new File(temporaryDir, "kotlinc-arguments.txt")
    def jvmArgumentFile = new File(temporaryDir, "kotlinc-jvm-arguments.txt")
    def outputFile = new File(temporaryDir, "kotlinc-output.txt")
    jvmArgumentFile.withWriter("UTF-8") { out ->
        ["-Dorg.jetbrains.kotlin.cliMessageRenderer=XML", "-cp", compilerClasspath.asPath].each { out.println(quoteArgument(it)) }
    }
    def javaExecutable = new File(System.getProperty("java.home"), System.getProperty("os.name").toLowerCase().contains("windows") ? "bin/java.exe" : "bin/java")
    // A compiler that never finishes must not hang the build: all rounds share this budget.
    def deadline = System.nanoTime() + TimeUnit.MINUTES.toNanos(10)
    for (int round = 0; round < 5 && !remaining.isEmpty(); round++) {
        classOutput.deleteDir()
        classOutput.mkdirs()
        def arguments = compilerArguments + ["-nowarn", "-no-stdlib", "-no-reflect",
                "-classpath", dependencies.join(File.pathSeparator), "-d", classOutput.absolutePath] + remaining*.absolutePath
        argumentFile.withWriter("UTF-8") { out ->
            arguments.each { out.println(quoteArgument(it)) }
        }
        def process = new ProcessBuilder(javaExecutable.absolutePath, "@${jvmArgumentFile.absolutePath}", "org.jetbrains.kotlin.cli.jvm.K2JVMCompiler", "@${argumentFile.absolutePath}")
                .redirectErrorStream(true)
                .redirectOutput(outputFile)
                .start()
        def finished = false
        try {
            finished = process.waitFor(Math.max(0L, deadline - System.nanoTime()), TimeUnit.NANOSECONDS)
        } finally {
            if (!finished) {
                process.destroyForcibly()
            }
        }
        if (!finished) {
            return fail("kotlinc did not finish within 10 minutes")
        }
        def exitValue = process.exitValue()
        if (exitValue == 0) {
            if (!leftOut.isEmpty()) {
                def names = leftOut.collect { it.name }.sort()
                logger.info("compileAppClassesForSbg: ${leftOut.size()} of ${kotlinFiles.size()} Kotlin sources get no prebuilt bindings because they only compile with the rest of the build: ${names.take(5).join(', ')}${names.size() > 5 ? ', ...' : ''} (${firstError})")
            }
            return true
        }

        def output = outputFile.getText("UTF-8")
        def start = output.indexOf("<MESSAGES>")
        def end = output.lastIndexOf("</MESSAGES>")
        def errors = []
        if (start >= 0 && end > start) {
            errors = new XmlSlurper().parseText(output.substring(start, end + "</MESSAGES>".length())).children()
                    .findAll { it.name().equalsIgnoreCase("error") || it.name().equalsIgnoreCase("exception") }
                    .collect { [path: it.@path.text(), message: it.text().readLines().take(2).join(" ").replaceAll(/\s+/, " ")] }
        }
        if (firstError == null && !errors.isEmpty()) {
            firstError = errors[0].message
        }
        def failing = errors.collect { it.path ? sourceByPath[new File(it.path).canonicalPath] : null }.toSet()
        if (exitValue != 1 || errors.isEmpty() || failing.contains(null)) {
            return fail("kotlinc exited with ${exitValue}: ${firstError ?: output.readLines().find { it.trim() } ?: 'no message'}")
        }
        remaining.removeAll(failing)
        leftOut.addAll(failing)
    }
    return fail("the sources did not compile on their own: ${firstError}")
}

// Name the Java classes of JS subclasses of Java classes after what they contain instead
// of where their extend() call is. Off unless the app sets -PuseContentBindings or
// `project.ext.useContentBindings = true` in App_Resources/Android/app.gradle or
// before-plugins.gradle. The runtime follows the class the generator then adds to the app.
def useContentBindings = { ->
    if (!project.hasProperty("useContentBindings")) {
        return false
    }
    def value = project.property("useContentBindings").toString()
    return value.isEmpty() || value.toBoolean()
}

task runSbg(type: BuildToolTask) {
    dependsOn "collectAllJars"
    dependsOn "compileAppClassesForSbg"
    inputs.files(tasks.named("compileAppClassesForSbg")).withPropertyName("appClasses")
    inputs.property("sbgAppClassesEnabled", provider { sbgAppClassesEnabled() })
    inputs.property("useContentBindings", provider { useContentBindings() })
    def rootPath = ""
    if (!findProject(':static-binding-generator').is(null)) {
        rootPath = Paths.get(project(':static-binding-generator').projectDir.path, "build/libs").toString()
        dependsOn ':static-binding-generator:jar'
    }

    outputs.dir("$OUTPUT_JAVA_DIR/com/tns/gen")
    inputs.dir(INPUT_JS_DIR)
    inputs.dir(extractedDependenciesDir)

    workingDir "$BUILD_TOOLS_PATH"
    mainClass = "-jar"

    def paramz = new ArrayList<String>()
    paramz.add(Paths.get(rootPath, "static-binding-generator.jar"))

    if (failOnCompilationWarningsEnabled()) {
        paramz.add("-show-deprecation-warnings")
    }

    setOutputs outLogger

    args paramz

    def sbgDependenciesFile = file("$BUILD_TOOLS_PATH/$SBG_JAVA_DEPENDENCIES")
    def sbgWarningsFile = file("$BUILD_TOOLS_PATH/sbg-warnings.txt")
    // Tells the generator which of its dependencies hold the app's own classes.
    def sbgAppClassesFile = file("$BUILD_TOOLS_PATH/sbg-app-classes.txt")
    // Written by the generator: the bindings of call sites that involve those classes.
    def sbgAppBindingsFile = file("$BUILD_TOOLS_PATH/sbg-app-bindings.txt")
    def javaLevels = provider {
        [source: android.compileOptions.sourceCompatibility.toString(),
         target: android.compileOptions.targetCompatibility.toString(),
         encoding: android.compileOptions.encoding ?: "UTF-8"]
    }
    doFirst {
        new File("$OUTPUT_JAVA_DIR/com/tns/gen").deleteDir()
        sbgAppBindingsFile.delete()
        sbgAppClassesFile.delete()

        // Not written by collectAllJars: the metadata generator reads the real compiled classes.
        def appClassesDir = SBG_APP_CLASSES_DIR.get().asFile
        if (sbgAppClassesEnabled() && appClassesDir.isDirectory()) {
            sbgDependenciesFile.withWriterAppend { it.println(appClassesDir.absolutePath) }
            sbgAppClassesFile.withWriter("UTF-8") { it.println(appClassesDir.absolutePath) }
        }

        if (useContentBindings()) {
            args("-content-keyed-bindings")
        }
    }
    doLast {
        if (sbgAppBindingsFile.isFile()) {
            try {
                // The lint options that only concern how javac is invoked are left out: this
                // compile has another classpath and no Android boot classpath.
                def compilerArgs = failOnCompilationWarningsEnabled() ? ["-Xlint:all,-options,-path", "-Werror"] : []
                leaveOutAppBindingsJavacRejects(sbgAppBindingsFile, sbgDependenciesFile.readLines().findAll { it },
                        SBG_APP_CLASSES_DIR.get().asFile, javaLevels.get(), compilerArgs, temporaryDir, logger)
            } catch (Exception | LinkageError e) {
                logger.warn("runSbg: the prebuilt bindings of the app's own classes were not checked, so the app's compile checks them (${e})")
            }
        }


        // The generator's standard output only reaches runSbg.log, and the
        // NativeScript CLI runs gradle with --quiet, which hides the warn level.
        if (sbgWarningsFile.isFile()) {
            sbgWarningsFile.eachLine { logger.quiet("runSbg: ${it}") }
        }
    }
}

def failOnCompilationWarningsEnabled() {
    return project.hasProperty("failOnCompilationWarnings") && (failOnCompilationWarnings || failOnCompilationWarnings.toBoolean())
}

def explodeAar(File compileDependency, File outputDir) {
    logger.info("explodeAar: Extracting ${compileDependency.path} -> ${outputDir.path}")

    if (compileDependency.name.endsWith(".aar")) {
        JarFile jar = new JarFile(compileDependency)
        Enumeration enumEntries = jar.entries()
        while (enumEntries.hasMoreElements()) {
            JarEntry file = (JarEntry) enumEntries.nextElement()
            if (file.isDirectory()) {
                continue
            }
            if (file.name.endsWith(".jar")) {
                def targetFile = new File(outputDir, file.name)
                InputStream inputStream = jar.getInputStream(file)
                new File(targetFile.parent).mkdirs()
                Files.copy(inputStream, targetFile.toPath(), StandardCopyOption.REPLACE_EXISTING)
            }
        }
        jar.close()
    } else if (compileDependency.name.endsWith(".jar")) {
        copy {
            from compileDependency.absolutePath
            into outputDir
        }
    }
}

static def md5(String string) {
    MessageDigest digest = MessageDigest.getInstance("MD5")
    digest.update(string.bytes)
    return new BigInteger(1, digest.digest()).toString(16).padLeft(32, '0')
}

class WorkerTask extends DefaultTask {
    @Inject
    WorkerExecutor getWorkerExecutor() {
        throw new UnsupportedOperationException()
    }
}

class EmptyRunnable implements Runnable {
    void run() {
    }
}

def getMergedAssetsOutputPath() {
    if (!project.hasProperty("mergedAssetsOutputPath")) {
        // mergedAssetsOutputPath not found fallback to the default value for android gradle plugin 3.5.1
        project.ext.mergedAssetsOutputPath = "$projectDir/build/intermediates/merged_assets/" + project.selectedBuildType + "/out"
    }
    return project.ext.mergedAssetsOutputPath
}

// Discover all jars and dynamically create tasks for the extraction of each of them
project.ext.allJars = []
allprojects {
    afterEvaluate { project ->
        def buildType = project.selectedBuildType
        def jars = []
        def artifactType = Attribute.of('artifactType', String)
        android.applicationVariants.configureEach { variant ->
            if (variant.buildType.name == buildType) {
                variant.getCompileClasspath(null).each { fileDependency ->
                    processJar(fileDependency, jars)
                }
            }
        }
    }
}

def processJar(File jar, jars) {
    if (!jars.contains(jar)) {
        jars.add(jar)
        def destDir = md5(jar.path)
        def outputDir = new File(Paths.get(extractedDependenciesDir, destDir).normalize().toString())

        def taskName = "extract_${jar.name}_to_${destDir}"
        logger.debug("Creating dynamic task ${taskName}")

        // Add discovered jars as dependencies of cleanupAllJars.
        // This is crucial for cloud builds because they are different
        // on each incremental build (as each time the gradle user home
        // directory is a randomly generated string)
        cleanupAllJars.inputs.files jar

        task "${taskName}"(type: WorkerTask) {
            dependsOn cleanupAllJars
            extractAllJars.dependsOn it

            // This dependency seems redundant but probably due to some Gradle issue with workers,
            // without it `runSbg` sporadically starts before all extraction tasks have finished and
            // fails due to missing JARs
            runSbg.dependsOn it

            inputs.files jar
            outputs.dir outputDir

            doLast {
                // Runing in parallel no longer seems to bring any benefit.
                // It mattered only when we were extracting JARs from AARs.
                // To try it simply remove the following comments.
                // workerExecutor.submit(EmptyRunnable.class) {
                explodeAar(jar, outputDir)
                // }
            }
        }
        project.ext.allJars.add([file: jar, outputDir: outputDir])
    }
}

task 'cleanupAllJars' {
    // We depend on the list of libs directories that might contain aar or jar files
    // and on the list of all discovered jars
    inputs.files(pluginDependencies)

    outputs.files cleanupAllJarsTimestamp

    doLast {
        def allDests = project.ext.allJars*.outputDir*.name
        def dir = new File(extractedDependenciesDir)
        if (dir.exists()) {
            dir.eachDir {
                // An old directory which is no longer a dependency (e.g. orphaned by a deleted plugin)
                if (!allDests.contains(it.name)) {
                    logger.info("Task cleanupAllJars: Deleting orphaned ${it.path}")
                    FileUtils.deleteDirectory(it)
                }
            }
        }
        new File(cleanupAllJarsTimestamp).write ""
    }
}


// Placeholder task which depends on all dynamically generated extraction tasks
task 'extractAllJars' {
    dependsOn cleanupAllJars
    outputs.files extractAllJarsTimestamp

    doLast {
        new File(cleanupAllJarsTimestamp).write ""
    }
}

// Since API 36.1 the SDK can ship platforms only in minor-versioned directories
// (e.g. android-37.0) with no plain android-37 alias, so the directory name can't be
// derived from android.compileSdkVersion alone — it has to be resolved against disk.
def resolveCompileSdkPlatformName(File sdkDirectory, String compileSdkVersion) {
    def platformsDir = new File(sdkDirectory, "platforms")
    if (new File(platformsDir, compileSdkVersion).isDirectory()) {
        return compileSdkVersion
    }

    def baseMatch = compileSdkVersion =~ /^android-(\d+)$/
    if (baseMatch.matches()) {
        def apiLevel = baseMatch.group(1)
        def bestName = null
        def bestMinor = -1
        platformsDir.listFiles()?.each { dir ->
            if (!dir.isDirectory()) {
                return
            }
            // Strict android-N.M only — extension dirs like android-33-ext4 are not base platforms
            def minorMatch = dir.name =~ /^android-(\d+)\.(\d+)$/
            if (minorMatch.matches() && minorMatch.group(1) == apiLevel) {
                def minor = minorMatch.group(2) as int
                if (minor > bestMinor) {
                    bestMinor = minor
                    bestName = dir.name
                }
            }
        }
        if (bestName != null) {
            return bestName
        }
    }

    throw new GradleException("No Android SDK platform directory found for ${compileSdkVersion} in ${platformsDir}. " +
            "Install the matching SDK Platform with the Android SDK Manager.")
}

task 'collectAllJars' {
    dependsOn extractAllJars
    description = "gathers all paths to jar dependencies before building metadata with them"

    def sdkPath = android.sdkDirectory.getAbsolutePath()

    doFirst {
        def platformName = resolveCompileSdkPlatformName(android.sdkDirectory, android.compileSdkVersion)
        def androidJar = sdkPath + "/platforms/" + platformName + "/android.jar"

        def allJarPaths = new LinkedList<String>()
        allJarPaths.add(androidJar)
        allJarPaths.addAll(pluginsJarLibraries)
        def ft = fileTree(dir: extractedDependenciesDir, include: "**/*.jar")
        ft.each { currentJarFile ->
            allJarPaths.add(currentJarFile.getAbsolutePath())
        }

        new File("$BUILD_TOOLS_PATH/$SBG_JAVA_DEPENDENCIES").withWriter { out ->
            allJarPaths.each { out.println it }
        }
        new File("$BUILD_TOOLS_PATH/$MDG_JAVA_DEPENDENCIES").withWriter { out ->
            allJarPaths.each {
                if (it.endsWith(".jar")) {
                    out.println it
                }
            }
        }

        new File("$BUILD_TOOLS_PATH/$SBG_INPUT_FILE").withWriter { out ->
            out.println INPUT_JS_DIR
        }
        new File("$BUILD_TOOLS_PATH/$SBG_OUTPUT_FILE").withWriter { out ->
            out.println OUTPUT_JAVA_DIR
        }

        allJarLibraries.addAll(allJarPaths)
    }
}

task copyMetadataFilters {
    outputs.files("$BUILD_TOOLS_PATH/whitelist.mdg", "$BUILD_TOOLS_PATH/blacklist.mdg")
    // use an explicit copy task here because the copy task itselfs marks the whole built-tools as an output!
    copy {
        from file("$rootDir/whitelist.mdg"), file("$rootDir/blacklist.mdg")
        into "$BUILD_TOOLS_PATH"
    }
}

task 'copyMetadata' {
    doLast {
        copy {
            from "$projectDir/src/main/assets/metadata"
            into getMergedAssetsOutputPath() + "/metadata"
        }
    }
}

def listf(String directoryName, ArrayList<File> store) {
    def directory = new File(directoryName)

    def resultList = new ArrayList<File>()

    def fList = directory.listFiles()
    resultList.addAll(Arrays.asList(fList))
    for (File file : fList) {
        if (file.isFile()) {
            store.add(file)
        } else if (file.isDirectory()) {
            resultList.addAll(listf(file.getAbsolutePath(), store))
        }
    }
    return resultList
}

task buildMetadata(type: BuildToolTask) {
    def rootPath = ""
    if (!findProject(':android-metadata-generator').is(null)) {
        rootPath = Paths.get(project(':android-metadata-generator').projectDir.path, "build/libs").toString()
        dependsOn ':android-metadata-generator:jar'
        // Without this the task stays up-to-date after the generator changes, so edits to it
        // silently produce no new metadata.
        inputs.files(tasks.getByPath(':android-metadata-generator:jar'))
    }



    android.applicationVariants.all { variant ->
        // The generator only reads the selected build type's classes (see doFirst),
        // so depending on the other variant's tasks would just force a second full
        // app build without affecting the produced metadata.
        if (variant.buildType.name != project.ext.selectedBuildType) {
            return
        }

        def buildTypeName = variant.buildType.name.capitalize()
        def mergeShadersTaskName = "merge${buildTypeName}Shaders"
        def mergeShadersTask = tasks.findByName(mergeShadersTaskName)

        if (mergeShadersTask) {
            dependsOn mergeShadersTask
        }

        def compileJavaWithJavacTaskName = "compile${buildTypeName}JavaWithJavac"
        def compileJavaWithJavacTask = tasks.findByName(compileJavaWithJavacTaskName)


        if (compileJavaWithJavacTask) {
            dependsOn compileJavaWithJavacTask
        }

        def compileKotlinTaskName = "compile${buildTypeName}Kotlin"
        def compileKotlinTask = tasks.findByName(compileKotlinTaskName)


        if (compileKotlinTask) {
            dependsOn compileKotlinTask
        }


        def mergeDexTaskName = "mergeDex${buildTypeName}"
        def mergeDexTask = tasks.findByName(mergeDexTaskName)

        if (mergeDexTask) {
            dependsOn mergeDexTask
        }

        def checkDuplicateClassesTaskName = "check${buildTypeName}DuplicateClasses"
        def checkDuplicateClassesTask = tasks.findByName(checkDuplicateClassesTaskName)

        if (checkDuplicateClassesTask) {
            dependsOn checkDuplicateClassesTask
        }

        def generateBuildConfigTaskName = "generate${buildTypeName}BuildConfig"
        def generateBuildConfigTask = tasks.findByName(generateBuildConfigTaskName)

        if (generateBuildConfigTask) {
            dependsOn generateBuildConfigTask
        }

        def dexBuilderTaskName = "dexBuilder${buildTypeName}"
        def dexBuilderTask = tasks.findByName(dexBuilderTaskName)

        if (dexBuilderTask) {
            dependsOn dexBuilderTask
        }


        def mergeExtDexTaskName = "mergeExtDex${buildTypeName}"
        def mergeExtDexTask = tasks.findByName(mergeExtDexTaskName)

        if (mergeExtDexTask) {
            dependsOn mergeExtDexTask
        }

        def mergeLibDexTaskName = "mergeLibDex${buildTypeName}"
        def mergeLibDexTask = tasks.findByName(mergeLibDexTaskName)

        if (mergeLibDexTask) {
            dependsOn mergeLibDexTask
        }

        def mergeProjectDexTaskName = "mergeProjectDex${buildTypeName}"
        def mergeProjectDexTask = tasks.findByName(mergeProjectDexTaskName)

        if (mergeProjectDexTask) {
            dependsOn mergeProjectDexTask
        }

        def syncLibJarsTaskName = "sync${buildTypeName}LibJars"
        def syncLibJarsTask = tasks.findByName(syncLibJarsTaskName)

        if (syncLibJarsTask) {
            dependsOn syncLibJarsTask
        }

        def mergeJavaResourceTaskName = "merge${buildTypeName}JavaResource"
        def mergeJavaResourceTask = tasks.findByName(mergeJavaResourceTaskName)

        if (mergeJavaResourceTask) {
            dependsOn mergeJavaResourceTask
        }

        def mergeJniLibFoldersTaskName = "merge${buildTypeName}JniLibFolders"
        def mergeJniLibFoldersTask = tasks.findByName(mergeJniLibFoldersTaskName)

        if (mergeJniLibFoldersTask) {
            dependsOn mergeJniLibFoldersTask
        }

        def mergeNativeLibsTaskName = "merge${buildTypeName}NativeLibs"
        def mergeNativeLibsTask = tasks.findByName(mergeNativeLibsTaskName)

        if (mergeNativeLibsTask) {
            dependsOn mergeNativeLibsTask
        }

        def stripDebugSymbolsTaskName = "strip${buildTypeName}DebugSymbols"
        def stripDebugSymbolsTask = tasks.findByName(stripDebugSymbolsTaskName)

        if (stripDebugSymbolsTask) {
            dependsOn stripDebugSymbolsTask
        }

        def validateSigningTaskName = "validateSigning${buildTypeName}"
        def validateSigningTask = tasks.findByName(validateSigningTaskName)

        if (validateSigningTask) {
            dependsOn validateSigningTask
        }


        def extractProguardFilesTaskName = "extractProguardFiles"
        def extractProguardFilesTask = tasks.findByName(extractProguardFilesTaskName)

        if (extractProguardFilesTask) {
            dependsOn extractProguardFilesTask
        }


        // def compileArtProfileTaskName = "compile${buildTypeName}ArtProfile"
        // def compileArtProfileTask = tasks.findByName(compileArtProfileTaskName)

        // if (compileArtProfileTask) {
        //     dependsOn compileArtProfileTask
        // }


        def extractNativeSymbolTablesTaskName = "extract${buildTypeName}NativeSymbolTables"
        def extractNativeSymbolTablesTask = tasks.findByName(extractNativeSymbolTablesTaskName)

        if (extractNativeSymbolTablesTask) {
            dependsOn extractNativeSymbolTablesTask
        }


        // def optimizeResourcesTaskName = "optimize${buildTypeName}Resources"
        // def optimizeResourcesTask = tasks.findByName(optimizeResourcesTaskName)

        // if (optimizeResourcesTask) {
        //     dependsOn optimizeResourcesTask
        // }

        def bundleResourcesTaskName = "bundle${buildTypeName}Resources"
        def bundleResourcesTask = tasks.findByName(bundleResourcesTaskName)

        if (bundleResourcesTask) {
            dependsOn bundleResourcesTask
        }

    }

    dependsOn copyMetadataFilters

    // As some external gradle plugins can reorder the execution order of the tasks it may happen that buildMetadata is executed after merge{Debug/Release}Assets
    // in that case the metadata won't be included in the result apk and it will crash, so to avoid this we are adding the copyMetadata task which will manually copy
    // the metadata files in the merge assets folder and they will be added to the result apk

    // The next line is added to avoid adding another copyData implementation from the firebase plugin - https://github.com/EddyVerbruggen/nativescript-plugin-firebase/blob/3943bb9147f43c41599e801d026378eba93d3f3a/publish/scripts/installer.js#L1105
    //buildMetadata.finalizedBy(copyMetadata)
    finalizedBy copyMetadata

    description = "builds metadata with provided jar dependencies"

    // collectAllJars rewrites this list on every build and doFirst then appends the class
    // directories to it, so fingerprint the jars it names rather than the file itself. Must
    // stay a provider: the list is only current once collectAllJars has run.
    def mdgJavaDependenciesFile = file("$BUILD_TOOLS_PATH/$MDG_JAVA_DEPENDENCIES")
    inputs.files(provider {
        mdgJavaDependenciesFile.exists() ? mdgJavaDependenciesFile.readLines().findAll { it.endsWith(".jar") } : []
    }).withPropertyName("dependencyJars")

    // make MDG aware of whitelist.mdg and blacklist.mdg files
    // inputs.files(project.fileTree(dir: "$rootDir", include: "**/*.mdg"))
    // use explicit inputs as the above makes the whole build-tools directory an input!
    inputs.files("$BUILD_TOOLS_PATH/whitelist.mdg", "$BUILD_TOOLS_PATH/blacklist.mdg")

    // Must mirror the directories doFirst scans. Declared lazily because they don't exist
    // yet at configuration time on a clean build, and limited to the selected build type
    // so the other variant's compile outputs never overlap this task's inputs.
    def compiledClassesBuildType = project.ext.selectedBuildType
    inputs.files(rootProject.subprojects.collectMany { sub ->
        [sub.layout.buildDirectory.dir("intermediates/javac/$compiledClassesBuildType"),
         sub.layout.buildDirectory.dir("tmp/kotlin-classes/$compiledClassesBuildType")]
    }).withPropertyName("compiledClasses")

    // This project's compile tasks are dependencies (see applicationVariants above). For
    // other subprojects only order after them: ones the app depends on are already reached
    // transitively, and a hard dependency would drag unrelated modules into the build.
    def compiledClassesTaskNames = ["JavaWithJavac", "Kotlin"].collect { "compile${compiledClassesBuildType.capitalize()}$it" }
    rootProject.subprojects.each { sub ->
        if (sub != project) {
            mustRunAfter { compiledClassesTaskNames.collect { sub.tasks.findByName(it) }.findAll { it != null } }
        }
    }

    inputs.property("widenMetadataFields", widenMetadataFields)

    outputs.files("$METADATA_OUT_PATH/treeNodeStream.dat", "$METADATA_OUT_PATH/treeStringsStream.dat", "$METADATA_OUT_PATH/treeValueStream.dat")

    workingDir "$BUILD_TOOLS_PATH"
    mainClass = "-jar"

    doFirst {
        // get compiled classes to pass to metadata generator
        // these need to be called after the classes have compiled
        new File(getMergedAssetsOutputPath() + "/metadata").deleteDir()

        def classesSubDirs = []
        def kotlinClassesSubDirs = []
        def selectedBuildType = project.ext.selectedBuildType

        rootProject.subprojects {

            def projectClassesDir = it.layout.buildDirectory.dir("intermediates/javac").get().asFile
            def projectKotlinClassesDir = it.layout.buildDirectory.dir("tmp/kotlin-classes").get().asFile

            if (projectClassesDir.exists()) {
                def projectClassesSubDirs = projectClassesDir.listFiles()
                for (File subDir : projectClassesSubDirs) {
                    if (!classesSubDirs.contains(subDir)) {
                        classesSubDirs.add(subDir)
                    }
                }
            }

            if (projectKotlinClassesDir.exists()) {
                def projectKotlinClassesSubDirs = projectKotlinClassesDir.listFiles()
                for (File subDir : projectKotlinClassesSubDirs) {
                    if (!kotlinClassesSubDirs.contains(subDir)) {
                        kotlinClassesSubDirs.add(subDir)
                    }
                }
            }
        }

        def generatedClasses = new LinkedList<String>()
        for (File subDir : classesSubDirs) {
            if (subDir.getName() == selectedBuildType) {
                generatedClasses.add(subDir.getAbsolutePath())
            }
        }

        for (File subDir : kotlinClassesSubDirs) {
            if (subDir.getName() == selectedBuildType) {
                generatedClasses.add(subDir.getAbsolutePath())
            }
        }

        def store = new ArrayList<File>()
        for (String dir : generatedClasses) {
            listf(dir, store)
        }


        new File("$BUILD_TOOLS_PATH/$METADATA_JAVA_OUT").withWriter { out ->
            store.each {
                out.println it.absolutePath
            }
        }


        new File("$BUILD_TOOLS_PATH/$MDG_OUTPUT_DIR").withWriter { out ->
            out.println "$METADATA_OUT_PATH"
        }

        new File("$BUILD_TOOLS_PATH/$MDG_JAVA_DEPENDENCIES").withWriterAppend { out ->
            generatedClasses.each { out.println it }
        }

        setOutputs outLogger

        def paramz = new ArrayList<String>()
        paramz.add(Paths.get(rootPath, "android-metadata-generator.jar"))

        if (enableAnalytics) {
            paramz.add("analyticsFilePath=$analyticsFilePath")
        }

        if (enableVerboseMDG) {
            paramz.add("verbose")
        }

        if (widenMetadataFields) {
            paramz.add("widen-fields")
        }

        args paramz.toArray()
    }
}

task generateTypescriptDefinitions(type: BuildToolTask) {
    def rootPath = ""
    if (!findProject(':dts-generator').is(null)) {
        rootPath = Paths.get(project(':dts-generator').projectDir.path, "build/libs").toString()
        dependsOn ':dts-generator:jar'
        inputs.files(tasks.getByPath(':dts-generator:jar'))
    }

    def paramz = new ArrayList<String>()

    workingDir "$BUILD_TOOLS_PATH"
    mainClass = "-jar"

    doFirst {
        def includeDirs = ["com.android.support", "/platforms/" + resolveCompileSdkPlatformName(android.sdkDirectory, android.compileSdkVersion)]

        delete "$TYPINGS_PATH"

        // Resolved against the project when building from source; an empty rootPath leaves it
        // relative to workingDir, which is where the packaged framework keeps the jar.
        paramz.add(Paths.get(rootPath, "dts-generator.jar").toString())
        paramz.add("--input")

        for (String jarPath : allJarLibraries) {
            // don't generate typings for runtime jars and classes
            if (shouldIncludeDirForTypings(jarPath, includeDirs)) {
                paramz.add(jarPath)
            }
        }

        paramz.add("--output")
        paramz.add("$TYPINGS_PATH")

        new File("$TYPINGS_PATH").mkdirs()

        logger.info("Task generateTypescriptDefinitions: Call dts-generator.jar with arguments: " + paramz.toString().replaceAll(',', ''))
        outLogger.withStyle(Style.SuccessHeader).println "Task generateTypescriptDefinitions: Call dts-generator.jar with arguments: " + paramz.toString().replaceAll(',', '')

        setOutputs outLogger

        args paramz.toArray()
    }
}

generateTypescriptDefinitions.onlyIf {
    (project.hasProperty("generateTypings") && Boolean.parseBoolean(project.generateTypings)) || PASSED_TYPINGS_PATH != null
}

collectAllJars.finalizedBy(generateTypescriptDefinitions)

static def shouldIncludeDirForTypings(path, includeDirs) {
    for (String p : includeDirs) {
        if (path.indexOf(p) > -1) {
            return true
        }
    }

    return false
}

task 'copyTypings' {
    doLast {
        outLogger.withStyle(Style.Info).println "Copied generated typings to application root level. Make sure to import android.d.ts in reference.d.ts"

        copy {
            from "$TYPINGS_PATH"
            into "$USER_PROJECT_ROOT"
        }
    }
}

// USER_PROJECT_ROOT is two levels above the gradle root, which only lands on an app when that
// root is <app>/platforms/android. In a runtime checkout it points outside the repository, so
// require some evidence of a real project before copying anything there.
def hasUserProject = { ->
    file("$USER_PROJECT_ROOT/$PACKAGE_JSON").exists() ||
            rootDir.toString().replace(File.separator, "/").endsWith(PLATFORMS_ANDROID)
}

// didWork only means the task ran, so on a failed generation this would still report success
// and copy an empty typings directory over the user's project.
copyTypings.onlyIf {
    generateTypescriptDefinitions.didWork &&
            generateTypescriptDefinitions.state.failure == null &&
            hasUserProject()
}
generateTypescriptDefinitions.finalizedBy(copyTypings)

task 'validateAppIdMatch' {
    doLast {
        def lineSeparator = System.getProperty("line.separator")

        if (project.hasProperty("nsApplicationIdentifier") && !project.hasProperty("release")) {
            if (project.nsApplicationIdentifier != android.defaultConfig.applicationId && android.namespace != appIdentifier) {
                def errorMessage = "${lineSeparator}WARNING: The Application identifier is different from the one inside \"package.json\" file.$lineSeparator" +
                        "NativeScript CLI might not work properly.$lineSeparator" +
                        "Remove applicationId from app.gradle and update the \"nativescript.id\" in package.json.$lineSeparator" +
                        "Actual: ${android.defaultConfig.applicationId}$lineSeparator" +
                        "Expected(from \"package.json\"): ${project.nsApplicationIdentifier}$lineSeparator"

                logger.error(errorMessage)
            }
        }
    }
}

